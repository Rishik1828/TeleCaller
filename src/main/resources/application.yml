spring:
  application:
    name: smart-dialer
  datasource:
    url: jdbc:h2:mem:smartdialer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  task:
    scheduling:
      pool:
        size: 5
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100

server:
  port: 8080

logging:
  level:
    com.smartdialer: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

smartdialer:
  safety:
    max-calls-per-available-agent: 1.0 # 1.0 for strict progressive safety
    max-ringing-exposure-ratio: 1.2
    max-outstanding-calls: 500
    circuit-breaker-failure-threshold-pct: 25.0
    min-sample-size-for-predictive: 20
    default-answer-rate: 0.30
    agent-reservation-lease-seconds: 45
    call-timeout-seconds: 60
  pacing:
    smoothing-alpha: 0.2
    safety-buffer-factor: 0.85
